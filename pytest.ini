[pytest]
testpaths = testcases
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --alluredir=allure-results

markers =
    api: 接口自动化用例
    ui: Web UI 自动化用例
    smoke: 冒烟用例（提测后必跑，15 分钟内出结果）
    p0: 核心链路，失败即阻塞发版
    p1: 重要功能
    p2: 一般功能 / 边界场景

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
