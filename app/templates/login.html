<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>登录 - 青柠商城</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
           background: #f5f7f4; display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; }
    .box { background: #fff; padding: 36px 32px; border-radius: 12px; width: 320px;
           box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 24px; color: #1f2d20; }
    label { display: block; font-size: 13px; color: #5a6b5c; margin: 14px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d7ddd6;
            border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #6fbf73; }
    button { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 8px;
             background: #6fbf73; color: #fff; font-size: 15px; cursor: pointer; }
    button:hover { background: #5fae63; }
    .err { color: #d64545; font-size: 13px; min-height: 18px; margin-top: 12px; }
    .tip { color: #9aa79b; font-size: 12px; margin-top: 18px; text-align: center; }
  </style>
</head>
<body>
  <div class="box">
    <h1>青柠商城 · 登录</h1>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" data-testid="username-input" autocomplete="off" />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" data-testid="password-input" />
      <button type="submit" data-testid="login-btn">登 录</button>
    </form>
    <div class="err" id="error-msg" data-testid="error-msg"></div>
    <div class="tip">测试账号：test01 / 123456</div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("error-msg");
      errEl.textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const body = await resp.json();
        if (body.code !== 0) {
          errEl.textContent = body.msg;          // 这里是 UI 用例的断言点
          return;
        }
        localStorage.setItem("token", body.data.token);
        localStorage.setItem("nickname", body.data.user.nickname);
        window.location.href = "/products";
      } catch (err) {
        errEl.textContent = "网络异常，请稍后重试";
      }
    });
  </script>
</body>
</html>
